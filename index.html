<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>Raksha — Women Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0a0f;
    color: #f5f2ea;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .splash {
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #131318;
    border: 1px solid rgba(201, 169, 97, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 60px rgba(201, 169, 97, 0.15);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 60px rgba(201, 169, 97, 0.15); }
    50% { box-shadow: 0 0 90px rgba(201, 169, 97, 0.3); }
  }
  .logo svg {
    width: 44px;
    height: 44px;
    color: #c9a961;
  }
  .title {
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: #c9a961;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(201, 169, 97, 0.3);
  }
  .tagline {
    font-size: 0.82rem;
    color: #a39d8a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  .loader {
    width: 40px;
    height: 2px;
    background: #1e1e26;
    border-radius: 2px;
    margin: 0 auto;
    overflow: hidden;
    position: relative;
  }
  .loader::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #c9a961, transparent);
    animation: loading 1.4s ease-in-out infinite;
  }
  @keyframes loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
</style>
</head>
<body>

<div class="splash">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z" fill="currentColor" fill-opacity="0.12"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
  </div>
  <div class="title">RAKSHA</div>
  <div class="tagline">Your Safety, Our Priority</div>
  <div class="loader"></div>
</div>

<script>
  // Redirect to main app after 1.2 seconds
  setTimeout(() => {
    window.location.href = 'app.html';
  }, 1200);
</script>

</body>
</html>
